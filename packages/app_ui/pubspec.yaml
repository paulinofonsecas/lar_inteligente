name: app_ui
description: Os tokens de design e os widgets de apresentação do painel do Lar Inteligente.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

dependencies:
  flutter:
    sdk: flutter
  material_symbols_icons: ^4.2960.0
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: HostGrotesk
      fonts:
        - asset: assets/fonts/HostGrotesk.ttf
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono.ttf
